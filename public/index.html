<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PO Signal Analyzer</title>
  <link rel="stylesheet" href="css/style.css?v=tf5s">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="app-container">

    <!-- Экран 1: список пар -->
    <section id="screen-main" class="screen active">
      <div class="header">
        <h1>📊 PO Аналізатор</h1>
        <p class="subtitle">Виберіть актив для аналізу</p>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">Всі</button>
        <button class="filter-btn" data-filter="currency">Валюти</button>
        <button class="filter-btn" data-filter="otc">OTC</button>
      </div>

      <div id="pairs-list" class="pairs-list"></div>
    </section>

    <!-- Экран 2: выбор таймфрейма -->
    <section id="screen-timeframe" class="screen">
      <div class="header">
        <button class="back-btn" id="btn-back-pairs">←</button>
        <h2 id="selected-pair-name">EUR/USD</h2>
        <p class="subtitle">Оберіть таймфрейм</p>
      </div>

      <div class="timeframe-buttons">
        <button class="tf-btn" data-tf="5">
          <span class="tf-number">5</span>
          <span class="tf-label">секунд</span>
        </button>
        <button class="tf-btn" data-tf="15">
          <span class="tf-number">15</span>
          <span class="tf-label">секунд</span>
        </button>
        <button class="tf-btn" data-tf="30">
          <span class="tf-number">30</span>
          <span class="tf-label">секунд</span>
        </button>
        <button class="tf-btn" data-tf="60">
          <span class="tf-number">1</span>
          <span class="tf-label">хвилина</span>
        </button>
        <button class="tf-btn" data-tf="180">
          <span class="tf-number">3</span>
          <span class="tf-label">хвилини</span>
        </button>
        <button class="tf-btn" data-tf="300">
          <span class="tf-number">5</span>
          <span class="tf-label">хвилин</span>
        </button>
      </div>

      <button class="primary-btn" id="btn-get-signal" disabled>
        📡 Отримати сигнал
      </button>
    </section>

    <!-- Экран 3: загрузка -->
    <section id="screen-loading" class="screen">
      <div class="loading-content">
        <div class="spinner"></div>
        <div class="loading-text">Аналізую ринок...</div>
        <div class="loading-sub" id="loading-detail">Завантаження свічок</div>
      </div>
    </section>

    <!-- Экран 4: результат -->
    <section id="screen-result" class="screen">
      <!-- Кнопки -->
      <div class="result-top-buttons">
        <button class="primary-btn" id="btn-new-signal">🔄 Новий сигнал</button>
        <button class="secondary-btn" id="btn-to-menu">📋 Меню</button>
      </div>

      <!-- Пара -->
      <div class="result-pair-row">
        <span id="result-pair">EUR/USD-OTC</span>
        <span class="badge-otc">🔒 OTC</span>
        <span id="result-tf">1 хв</span>
      </div>

      <!-- Точность и сила -->
      <div class="accuracy-strength-row">
        <div class="accuracy-wrap">
          <span class="accuracy-label">Точність</span>
          <span class="accuracy-value" id="result-accuracy">87%</span>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="strength-wrap" id="result-strength">✅ СИЛЬНИЙ</div>
      </div>

      <!-- Направление -->
      <div class="direction-box" id="direction-box">
        <span class="direction-arrow" id="direction-arrow">↑</span>
        <span class="direction-text" id="direction-text">ВВЕРХ</span>
        <span class="direction-expiry" id="direction-expiry">до 21:47</span>
        <span class="direction-dot" id="direction-dot">🟢</span>
      </div>

      <!-- Индикаторы -->
      <div class="indicators-grid" id="indicators-grid">
        <!-- Заполняется из app.js -->
      </div>

      <!-- OTC-статистика -->
      <div class="otc-stats-box" id="otc-stats-box">
        <div class="otc-stats-title">🔔 OTC статистика:</div>
        <div class="otc-stats-grid" id="otc-stats-grid">
          <!-- Заполняется из app.js -->
        </div>
      </div>

      <!-- Факторы -->
      <div class="factors-section">
        <ul class="factors-list" id="factors-list"></ul>
      </div>
    </section>

    <!-- Экран 5: пауза после сигнала -->
    <section id="screen-cooldown" class="screen">
      <div class="cooldown-content">
        <div class="cooldown-icon">⏳</div>
        <h2>Зачекайте!</h2>
        <p class="cooldown-text">Перед наступним запитом потрібно зачекати</p>
        <div class="cooldown-timer" id="cooldown-timer">00:00</div>
        <div class="cooldown-pair" id="cooldown-pair">EUR/USD (1 хв)</div>
        <button class="secondary-btn" id="btn-cooldown-menu">📋 Меню</button>
      </div>
    </section>

  </div>

  <script src="js/app.js?v=tf5s"></script>
</body>
</html>
